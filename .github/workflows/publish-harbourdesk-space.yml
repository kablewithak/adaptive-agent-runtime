name: Publish HarbourDesk Space

on:
  push:
    branches:
      - main
    paths:
      - "space/**"
      - "scripts/validate_harbourdesk_space_evidence.py"
      - "tests/unit/publication/test_harbourdesk_space_evidence.py"
      - ".github/workflows/publish-harbourdesk-space.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: harbourdesk-space-production
  cancel-in-progress: true

jobs:
  qualify-and-publish:
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: KaboKableMolefe/harbourdesk-ai-reliability
      HF_OIDC_RESOURCE: spaces/KaboKableMolefe/harbourdesk-ai-reliability

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python qualification and publish tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "huggingface_hub>=1.19.0,<2"

      - name: Validate public evidence boundary
        run: python scripts/validate_harbourdesk_space_evidence.py

      - name: Run publication boundary test
        run: python -m pytest tests/unit/publication/test_harbourdesk_space_evidence.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json

      - name: Install frontend dependencies
        working-directory: space
        run: npm ci

      - name: Lint frontend
        working-directory: space
        run: npm run lint

      - name: Build frontend
        working-directory: space
        run: npm run build

      - name: Prepare tracked publish tree
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="$RUNNER_TEMP/harbourdesk-space"
          mkdir -p "$PUBLISH_DIR"

          git archive --format=tar HEAD:space | tar -xf - -C "$PUBLISH_DIR"

          test -f "$PUBLISH_DIR/README.md"
          test -f "$PUBLISH_DIR/package.json"
          test -f "$PUBLISH_DIR/package-lock.json"
          test -f "$PUBLISH_DIR/src/App.tsx"
          test -f "$PUBLISH_DIR/evidence/results.json"
          test -f "$PUBLISH_DIR/evidence/provenance.json"

          test ! -e "$PUBLISH_DIR/node_modules"
          test ! -e "$PUBLISH_DIR/dist"

          if find "$PUBLISH_DIR" -type f \(             -path "*/evaluation_private/*" -o             -path "*/runs/*"           \) | grep -q .; then
            echo "Forbidden private experiment material found in publish tree."
            exit 1
          fi

          echo "Tracked publish tree:"
          find "$PUBLISH_DIR" -type f -printf '%P\n' | sort

      - name: Publish to Hugging Face Space with OIDC
        shell: bash
        run: |
          set -euo pipefail

          hf upload             "$HF_REPO_ID"             "$RUNNER_TEMP/harbourdesk-space"             .             --repo-type space             --delete "*"             --commit-message "Deploy GitHub ${GITHUB_SHA::7}"
